[tool.poetry]
name = "museums-tracker"
version = "1.1.1"
description = "App for art & museum lovers"
authors = ["Aydar Gazizullin <aydarcyber@gmail.com>"]
license = "Proprietary"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
flask = "^3.1.3"
