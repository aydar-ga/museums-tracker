name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Validates this file, so a broken workflow fails loudly instead of in 0s.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  checks:
    name: Format, lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==2.5.2

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Run checks (same as `make check` locally)
        run: make check

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build image (what Render builds)
        run: docker build -t museums-explorer:ci .

      - name: Start container
        run: docker run -d --name app -e PORT=8080 -p 8080:8080 museums-explorer:ci

      - name: Smoke test
        run: |
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Top 50 Art Museums Explorer"
          test "$(curl -fsS http://localhost:8080/ | grep -c 'class="museum-item"')" -eq 50
          curl -fsS -o /dev/null http://localhost:8080/static/js/scripts.js
          curl -fsS -o /dev/null http://localhost:8080/static/css/styles.css
          curl -fsS -o /dev/null http://localhost:8080/static/images/louvre.jpg

      - name: Container logs
        if: always()
        run: docker logs app
